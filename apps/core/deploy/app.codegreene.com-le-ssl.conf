# app.codegreene.com: HTTPS -> web container (nginx) on 127.0.0.1:3601. Enable only after the cert exists.
<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName app.codegreene.com
  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/app.codegreene.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/app.codegreene.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
  LimitRequestBody 7340032
  ProxyPreserveHost On
  ProxyTimeout 60
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https"
  # ACME renewals keep working over HTTPS too
  Alias /.well-known/acme-challenge/ /var/www/acme/app.codegreene.com/.well-known/acme-challenge/
  ProxyPass /.well-known/acme-challenge/ !
  ProxyPass / http://127.0.0.1:3601/
  ProxyPassReverse / http://127.0.0.1:3601/
  ErrorLog ${APACHE_LOG_DIR}/app.codegreene.com-error.log
  CustomLog ${APACHE_LOG_DIR}/app.codegreene.com-access.log combined
</VirtualHost>
</IfModule>
