# app.codegreene.com: HTTP. Serves ACME challenges from a webroot, redirects everything else to HTTPS.
<VirtualHost *:80>
  ServerName app.codegreene.com
  DocumentRoot /var/www/acme/app.codegreene.com
  <Directory /var/www/acme/app.codegreene.com>
    Options -Indexes
    AllowOverride None
    Require all granted
  </Directory>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://app.codegreene.com%{REQUEST_URI} [L,R=301]
  ErrorLog ${APACHE_LOG_DIR}/app.codegreene.com-error.log
  CustomLog ${APACHE_LOG_DIR}/app.codegreene.com-access.log combined
</VirtualHost>
