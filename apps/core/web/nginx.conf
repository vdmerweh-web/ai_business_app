server_tokens off;
server{listen 80 default_server;server_name app.codegreene.com localhost;root /usr/share/nginx/html;client_max_body_size 6m;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;
location /api/{proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;proxy_read_timeout 60s;}
location /s/{add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;add_header X-Content-Type-Options "nosniff" always;proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;}
location = /embed/pg.js{proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;}
location /auth/google/{proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;}
location /assets/{add_header Cache-Control "public, max-age=31536000, immutable";add_header X-Content-Type-Options "nosniff" always;try_files $uri =404;}
location = /sw.js{add_header Cache-Control "no-cache";add_header X-Robots-Tag "noindex, nofollow" always;add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;add_header X-Content-Type-Options "nosniff" always;add_header X-Frame-Options "DENY" always;add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;try_files $uri =404;}
location = /index.html{add_header Cache-Control "no-cache";add_header X-Robots-Tag "noindex, nofollow" always;add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;add_header Referrer-Policy "strict-origin-when-cross-origin" always;add_header X-Content-Type-Options "nosniff" always;add_header X-Frame-Options "DENY" always;add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; object-src 'none'; manifest-src 'self'; worker-src 'self'" always;}
location /{try_files $uri $uri/ /index.html;}}
# Client sites by hostname: <name>.codegreene.com / <name>.planet-grid.com (and later clients' own domains).
# Exact names like app.codegreene.com always match the block above first. Needs DNS + Apache + certificate (Admin) before it is reachable.
server{listen 80;server_name ~^(?<sub>[a-z0-9-]+)\.(codegreene|planet-grid)\.com$;client_max_body_size 1m;
location /api/public/{proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;}
location = /embed/pg.js{proxy_pass http://api:3600;proxy_set_header Host $host;}
location /{rewrite ^(.*)$ /_host$1 break;proxy_pass http://api:3600;proxy_set_header Host $host;proxy_set_header X-Forwarded-Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;}}
