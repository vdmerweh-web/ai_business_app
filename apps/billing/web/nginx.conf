server_tokens off;
server{listen 80;root /usr/share/nginx/html;client_max_body_size 2m;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://api.planet-grid.com https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://www.youtube-nocookie.com; connect-src 'self' https://api.planet-grid.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.planet-grid.com https://accounts.google.com; object-src 'none'" always;
# PDFs open in the app's side panel iframe: own location so the server-level DENY/'none' headers are not added; the API sends SAMEORIGIN + frame-ancestors 'self'.
location /api/pdf/{proxy_pass http://api:3000;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;add_header Referrer-Policy "strict-origin-when-cross-origin" always;}
location /api/{proxy_pass http://api:3000;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;proxy_set_header X-Forwarded-Proto https;}
location /assets/{add_header Cache-Control "public, max-age=31536000, immutable";add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;add_header X-Content-Type-Options "nosniff" always;try_files $uri =404;}
location = /sw.js{add_header Cache-Control "no-cache";add_header Service-Worker-Allowed "/";add_header X-Content-Type-Options "nosniff" always;try_files $uri =404;}
location = /manifest.webmanifest{default_type application/manifest+json;types{}add_header Cache-Control "no-cache";add_header X-Content-Type-Options "nosniff" always;try_files $uri =404;}
location /{try_files $uri /index.html;}}
